name: Unpack project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          ARCHIVE=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ARCHIVE"

          mkdir /tmp/project
          unzip -q "$ARCHIVE" -d /tmp/project

          COUNT=$(find /tmp/project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "$(find /tmp/project -mindepth 1 -maxdepth 1)" ]; then
            SRC=$(find /tmp/project -mindepth 1 -maxdepth 1)
          else
            SRC=/tmp/project
          fi

          rsync -a "$SRC"/ ./

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git add -A -- . ':!.github/workflows/build.yml'
          git reset -- '*.zip' || true
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android project from ZIP"
            git push
          fi
